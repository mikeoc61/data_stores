[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-warehouse"
version = "0.1.0"
description = "DuckDB warehouse for the Morning Intel Brief: daily on-chain, price, market, credit, and flow series."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
market-warehouse-daily = "market_warehouse.daily_update:main"
market-warehouse-backfill = "market_warehouse.backfill:main"
market-warehouse-btc-backfill = "market_warehouse.btc_backfill:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
